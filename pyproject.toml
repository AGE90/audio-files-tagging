[project]
name = "aft"
version = "0.1.0"
description = "A project for automatically adding metadata to audio files."
authors = [{ name = "AGE90", email = "alejandrogomezechavarria@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyprojroot>=0.3.0,<0.4.0",
    "discogs-client>=2.3.0,<3.0.0",
    "mutagen>=1.47.0,<2.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "pymysql>=1.1.0,<2.0.0",
    "librosa>=0.10.0,<0.11.0",
    "numpy>=1.26,<2.0.0",
    "typer>=0.9.0,<0.10.0",
    "click>=8.1,<8.2",  # typer 0.9.x calls Parameter.make_metavar() without ctx, removed in click 8.2
    "PySide6>=6.6.0,<6.10",
    "matplotlib>=3.10.7,<4.0.0",
]

[project.urls]
homepage = "https://example.com"
"Bug Tracker" = "https://example.com/issues"

[dependency-groups]
dev = [
    "pytest>=6.0",
    "pytest-cov>=6.2.1",
    "mypy>=1.16.1",
    "flake8>=7.3.0",
    "black>=25.1.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aft"]

# Pytest configuration
[tool.pytest.ini_options]
addopts = ["--cov=src"]
testpaths = ["tests"]

# Mypy configuration
[tool.mypy]
mypy_path = "src"
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true

# Black configuration
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["aft"]
